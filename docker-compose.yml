version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: adago_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: adago_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: adago_app
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=rootpassword
      - DB_NAME=adago_db
      - PORT=3000
      - JWT_SECRET=supersecretkey_adago2026
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run dev

  proxy:
    image: nginx:alpine
    container_name: adago_proxy
    ports:
      - "3443:3443"
    volumes:
      - ./nginx/local-proxy.conf:/etc/nginx/conf.d/default.conf
      - ./cert.pem:/etc/nginx/cert.pem
      - ./key.pem:/etc/nginx/key.pem
    depends_on:
      - app

volumes:
  db_data:
